[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# Regelsatz ausdrücklich festhalten: ruff 0.16 hat die Standardauswahl
# erweitert (u. a. UP, BLE, RUF, I). Bis 0.15 galt genau diese Auswahl.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
allow_untyped_calls = true
check_untyped_defs = true
disable_error_code = "import-untyped"
exclude = [
    "ecoflow_cloud/config_flow.py",
]